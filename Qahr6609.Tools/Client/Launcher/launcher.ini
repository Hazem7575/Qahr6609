; scripthazem launcher settings
[Launcher]
; patch/news server (PatchServer) - must end with /
UpdateUrl=http://26.31.69.47:8800/
; optional mirrors - tried in order when the main UpdateUrl is unreachable or a chunk keeps failing.
; add as many as you need (UpdateUrlMirror1..UpdateUrlMirror8); each must end with /
;UpdateUrlMirror1=http://mirror1.example.com:8800/
;UpdateUrlMirror2=http://mirror2.example.com:8800/
; how many files download at the same time (default 3, 1..8)
DownloadThreads=3
; download speed cap in KB/s for the whole launcher (0 = unlimited; e.g. 2048 = ~2 MB/s)
DownloadKBps=0
; used only to show Online/Offline (login server port)
ServerIP=26.31.69.47
LoginPort=9961
; game server port, also checked for Online/Offline when set (0 or empty = login port only)
GamePort=5817
; client login-server list written from the patch server's <UpdateUrl>servers before the game starts
; (empty = never touch it; when the patch server does not answer the file is left as it is)
ServerListFile=Guard.dat
; game server picked in the launcher (only used when more than one server is published)
Server=
; game start (relative to the launcher folder)
GameExe=Env_DX9\Conquer.exe
GameArgs=blacknull
WorkingDir=Env_DX9
SettingsIni=Settings.ini
; 1 = close launcher after starting the game, 0 = minimize
CloseOnPlay=1
; links (leave empty to hide the button)
Facebook=
Discord=
Website=
; theme folder name inside themes\ (colours, images, texts, fonts)
Theme=default
; ar = عربي , en = English (also switchable from the launcher)
Language=ar

; ---- pre-launch system check + crash reporting (all keys optional) ----
[SystemCheck]
; 1 = check DirectX / VC++ runtime / disk space before the game starts; 0 = never check
Enabled=1
; 0 = only warn and let the player continue; 1 = block the launch when a hard requirement (RequiredFiles) is missing
BlockOnFail=0
; warn when the client drive has less free space than this (MB)
MinFreeDiskMB=500
CheckDirectX=1
CheckVCRuntime=1
; shown as a "how to fix" link when a runtime is missing - nothing is bundled or downloaded automatically
VCRedistUrl=https://aka.ms/vs/9.0/vc_redist.x86.exe
DirectXUrl=https://www.microsoft.com/download/details.aspx?id=35
; files that MUST exist (relative to WorkingDir, or absolute) - missing = hard fail. comma separated. leave empty for none.
; (also handy to test the warning: point it at a bogus dll, e.g. RequiredFiles=does_not_exist.dll)
RequiredFiles=
; 1 = detect an abnormal game exit and offer to save a crash report under reports\
CrashReporting=1
; 1 = also send the crash report to the patch server so the team gets it automatically (0 = keep it local only)
CrashUpload=1
; where crash reports are POSTed. leave empty to use UpdateUrl + "crash" (the same patch server the launcher updates from)
CrashUploadUrl=
; a game exit within this many seconds counts as a crash; also how long the launcher watches before it closes (CloseOnPlay)
CrashWatchSeconds=15

; ---- background music: the player's own choice (persists across restarts) ----
; these are written by the launcher when the user changes the volume or hits the mute button.
; leave them blank to use the theme's defaults (themes\<name>\theme.ini [Music]).
[Music]
; 0..100 (blank = use the theme default volume)
Volume=
; 1 = muted, 0 = playing (blank = use the theme StartMuted)
Muted=
