# ===================================================================================
#  packetbridge.ini  -  config of PacketBridge.dll (server side of PacketStudio)
#  Copy this file next to your GameServer exe as "packetbridge.ini" (or any path you
#  pass to PacketBridge.Start). It is re-read every 3 seconds: no restart needed.
#  Delete the file or set enabled=0 to turn everything off.
# ===================================================================================

# Master switch. 0 = nothing listens, the hooks cost almost nothing.
enabled=1

# Shared secret (8+ characters, required). PacketStudio must use the same one.
# CHANGE IT. Never post it, never reuse a real password.
secret=CHANGE_ME_to_a_long_random_secret

# ---------------- live stream (PacketStudio > Sources > Connect) ----------------
# Listens on 127.0.0.1 ONLY (never on your public IP).
port=17957
# How many PacketStudio windows may watch at the same time.
max_clients=4
# Frames buffered per watcher before the oldest are dropped (the game never waits).
queue=50000
# Optional filters (empty = everything):
#   ids=2200,2099      only these packet ids
#   skip=2036          never these ids
#   player=TestHero    only this character
#   dir=both           both | in (client->server) | out (server->client)
ids=
skip=
player=
dir=both

# ---------------- optional text log ----------------
# log=1 writes PacketLogs\yyyy-MM-dd.log next to the server exe (PacketStudio can open it).
log=0
# hex bytes per line (-1 = whole packet, 0 = none)
log_hex=96
log_dir=PacketLogs
# ids never written to the text log (ping / tick spam)
log_skip=2036,2020

# ---------------- packet injection (PacketStudio > Packet test) ----------------
# DEVELOPMENT ONLY. With devmode=0 the injection port is closed.
devmode=0
inject_port=17958
# Optional separate secret for injection (empty = same as secret=)
inject_secret=
# ONLY these characters (names or UIDs) can ever receive an injected packet.
# Empty = every send is refused. Put your TEST characters here, never real players.
allow=TestHero,1000001
# TQServer = the packet handed to your sink ends with the 8-byte "TQServer" seal
#            (what most 5xxx-7xxx sources' Send() expects). none = bare packet.
inject_seal=TQServer
# Largest packet that may be injected (bytes)
inject_max=1024
