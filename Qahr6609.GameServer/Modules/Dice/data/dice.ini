; Dice / Sic Bo (client window 262 "Please bet"). Copied to ServerDataBase\Modules\Dice\dice.ini the first time:
; edit that copy, then @dice reload.

[Dice]
; 1 = rounds run, 0 = closed (also @dice on / @dice off)
Enabled=1
; betting time of a round, seconds. The client's alarm clock shows at most 50.
BetSeconds=40
; bets in the last N seconds of the betting time are refused (the countdown on the client is rounded)
CutoffSeconds=1
; time between the result and the next round: the client spins the dice up to 3 s and shows the result 5 s,
; then clears the table by itself. Less than 9 would wipe the first bets of the next round from the screen.
ResultSeconds=12
MinLevel=1

[Bets]
; the only amounts accepted: the 4 chips of the window (Dice.lua DiceBaseAmount 10/100/300/1000 x DiceBetRate 10000)
Chips=100000,1000000,3000000,10000000
; per player: on one cell, and in one round (all cells)
MaxBetPerCell=50000000
MaxBetPerRound=200000000
; per player and round: number of chips, and the shortest time between two chips (ms)
MaxBetsPerRound=80
MinBetIntervalMs=120
; official Sic Bo: Small and Big lose on a triple
TripleLosesSmallBig=1

[Payout]
; total paid back = bet x multiplier (the stake is included). These are the numbers the client draws on the table
; (client ini\Info.ini [DiceBetType]); change them only together with the client file.
SmallBig=2
Triple=150
Sum4And17=50
Sum5And16=25
Sum6And15=15
Sum7And14=12
Sum8And13=8
Sum9To12=6

[Misc]
; results kept for the "Lottery" window
HistoryCount=10
; a world line when a player wins at least this much in one round (0 = never)
AnnounceWinAbove=500000000
; GM test commands @dice bet / @dice roll (dice can be forced). Keep 0 on a live server.
DevCommands=0
