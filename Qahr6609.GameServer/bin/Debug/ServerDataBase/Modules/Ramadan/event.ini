; =====================================================================
;  The Legend of the Last Crescent - Ramadan event configuration
;  File: ServerDataBase\Modules\Ramadan\event.ini (from Qahr6609.GameServer\Modules\Ramadan\data\event.ini)
;  Reload in game with @ramadan reload  (no restart needed)
;  Times are SERVER local time. Lines starting with ; are comments.
; =====================================================================

[Event]
; 1 = on, 0 = off (also @ramadan on / @ramadan off). Off keeps all player data.
Enabled=0
; Story, dailies, caravans and the boss run only between Start and End (yyyy-MM-dd HH:mm).
; Ramadan 2027 is expected around 2027-02-08 -> 2027-03-09: set the real dates before going live.
Start=2026-10-11 00:00
End=2026-11-10 23:59
; The Crescent Merchant and Herald stay open this many days after End.
ShopGraceDays=7
; Hour (0-23) at which the nightly tasks reset.
DailyResetHour=4
; Show a message to players when they log in during the event.
LoginAnnouncement=1

[Npcs]
; Key = uid,lookType,dir,map,x,y
; The UID is fixed (bound to NpcID in the source).
; lookType >= 5000 = human NPC from the client's ini\NpcX.ini [id]; lookType < 5000 = ini\npc.ini [NpcTypeN].
Guardian=8155001,6020,0,1002,235,249
Lamplighter=8155002,6002,0,1036,213,197
Rashid=8155004,6004,0,1002,381,254
Noor=8155005,6005,0,1011,215,202
Kareem=8155006,6006,0,1020,567,566
Salma=8155007,6007,0,1000,478,636
Watchman=8155008,6008,0,1015,719,575
CaravanMaster=8155009,6009,0,1002,424,374
GateKeeper=8155010,6010,0,1002,241,243
Merchant=8155011,6011,0,1002,232,252
Herald=8155012,6012,0,1002,238,246

[Decor]
