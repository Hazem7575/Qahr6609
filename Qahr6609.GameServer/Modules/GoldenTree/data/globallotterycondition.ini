; Golden Tree (Global Lottery) conditions. Read by code\GlobalLotteryTable.cs.
; The client reads the same values from its own ini\globallotterycondition.ini (prizes panel, picking cost, cooldown):
; the server writes that file to ServerDataBase\Modules\GoldenTree\client\ini\ at every start / @goldentree reload.
; Copy it into the client patch (ini\) after a change here, or the window shows wrong / empty values.
;   id        condition id sent to the client (keep id = Type)
;   Type      prize pool: the "Type" column of global_lottery_pool.txt (21, 22, 117, 156)
;   CostType  1 = CPs, 2 = Silver, 5 = one item (CostValue = its item id; 3303191 = AnniversaryStar, as on the official server)
;   CostValue cost of one pick
;   Monopoly  how CPs are paid (CostType 1): 0 = CPs(B) first, then CPs if the player agrees, 1 = CPs(B) only, 2 = CPs only
;             (the client also writes "(B)" after an item cost when this is not 2)
;   CD        picking cooldown per player, seconds (0 = none)
;   CDCost    CPs to skip a whole cooldown ("Reset CD Cost"; a part of the cooldown costs that part of it)
;   StartTime YYYYMMDDhhmmss of a planned bloom: the client shows "Golden Tree will bloom at MM/DD hh:mm" (0 = none)
;   Desc      the text in the window
; [ConditionAmount] Active = id of the condition used for every bloom (0 = random condition per bloom).
; Start a bloom in game:  @goldentree start <hours> [max picks, 0 = whole pool]

