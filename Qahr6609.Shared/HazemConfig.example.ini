; EXAMPLE (no secrets) - copy to HazemConfig.ini and fill the empty secret values.
; Hazem master settings - THE one file to edit (docs\MULTI_SERVER.md).
; Qahr6609.Tools\Server\Cluster\configure.bat writes every derived file from it (shell.ini of each server, client_config.ini,
; AccServer AuthConfig.ini, launcher.ini, PatchServer.ini, the client server list Guard.txt / Guard.dat)
; after backing the old ones up; "configure.bat -Check" only shows what would change.
; The AccountServer, the game servers, the PatchServer and Qahr6609.Tools\Server\Cluster also read the [ServerN]/[Realm]/[Auth]
; sections of this file directly.
; ';' starts a comment anywhere on a line. Folders are relative to this file's folder (the repo root).
; This file holds secrets (MySQL password, keys): it is git-ignored. HazemConfig.example.ini is the template without them.

[Global]
PublicIP=26.31.69.47            ; IP players connect to (login server, game servers, patch server)
MySqlHost=localhost             ; MySQL / MariaDB server
MySqlPort=3306                  ; MySQL port
MySqlUser=root                  ; MySQL user
MySqlPassword=         ; MySQL password (only here; configure copies it into shell.ini / AuthConfig.ini)
MySqlDatabase=mega              ; account database shared by AccountServer and every game server
MySqlService=MariaDB            ; Windows service the control panel checks before starting anything
ConsoleMode=minimized          ; control panel: windows of the started servers: normal | minimized | hidden (logs: cluster.bat logs all)
AuthHost=26.31.69.47            ; AccountServer (login) address written into launcher.ini, PatchServer.ini and Guard.dat (empty = PublicIP)
AuthPort=9961                   ; AccountServer (login) port, also shown in launcher.ini
PatchServerHost=                ; host in the launcher's UpdateUrl (empty = PublicIP)
PatchServerPort=8800            ; PatchServer HTTP port (UpdateUrl = http://host:port/)
LoginKey=          ; first CAST5 key of the game connection, compiled into the client shield dll: never change alone
TransferKey=    ; game server TransferCipher key (empty = random per start; the cipher is unused)
TransferSalt=  ; game server TransferCipher salt (empty = random per start)
InterServerSecret=              ; pipe v2 shared secret, >= 32 chars, same on every server (empty = cross-server pipe OFF)
PipeBindIP=127.0.0.1            ; interface the Realm pipe listens on (LAN IP when servers run on several PCs, never 0.0.0.0 public)
PipeHost=127.0.0.1              ; address the servers use to reach each other's pipe (client_config.ini column 10)
ClientPatchFolder=..\ClientPatch\files ; client patch served by the PatchServer (configure -GuardDat writes Guard.dat here; see ClientPatch\README_AR.md)
LauncherFolder=..\Qahr6609.Tools\Client\Launcher ; launcher source folder (Launcher\launcher.ini)
PatchServerFolder=..\Qahr6609.Tools\Server\PatchServer ; PatchServer folder (PatchServer.ini)
GuardTxt=..\Qahr6609.Tools\Server\Cluster\generated\Guard.txt ; plain client server list written by configure (Guard.dat only with -GuardDat)

[Auth]
Folder=..\Qahr6609.AccServer\bin\Debug ; AccountServer working folder (AuthConfig.ini lives there)
Exe=AccServer.exe               ; process the control panel starts / stops
Port=9961                       ; = [Global] AuthPort
Enabled=1                       ; control panel starts it

[Realm]
Enabled=0                       ; cross-server hub (pipe v2 ready, not running yet)
Name=Realm1                     ; shell.ini ServerName of the Realm and its client_config.ini row
ServerID=5                      ; client_config.ini id of the Realm
Folder=..\_servers\Realm        ; created later with Qahr6609.Tools\Server\Cluster\new_server.ps1 -Realm
Exe=GameServer.exe              ; same exe as the game servers ([InterServer] IsInterServer=1)
PipePort=9921                   ; pipe listener port (client_config.ini column 11)
ItemUIDMin=1900000000           ; item UID range of the Realm (never overlaps a game server)
ItemUIDMax=1999999999

[Server1]
Name=Hazem                      ; shell.ini ServerName = client_config.ini name = name shown in the client list
ClientNames=MeGa                ; other names the client may send at login (old name inside the client): AccountServer maps them here
LoginName=MeGa                  ; name written into the client's Guard.dat (what the client sends); empty = Name
ServerID=1                      ; unique id (client_config.ini, login token binding, item UID range)
Folder=..\Qahr6609.GameServer\bin\Debug ; working folder of the process (shell.ini + ServerDataBase\)
Exe=GameServer.exe              ; process the control panel starts / stops
Host=26.31.69.47                ; IP the AccountServer sends players to (normally = PublicIP)
GamePort=5817                   ; game port
PipePort=9916                   ; this server's pipe port (client_config.ini column 11; listener only with PipeEnabled)
Published=1                     ; 1 = shown to players (AccountServer list, launcher, Guard.dat), 0 = staff only
Enabled=1                       ; 1 = the control panel starts it with "start all"
ItemUIDMin=1                    ; item UIDs of this server: [ItemUIDMin, ItemUIDMax], never overlapping another entry
ItemUIDMax=99999999
