; ------------------------------------------------------------------ dialogs
[Dialog.Elder]
Text=After 10 years of practice, I finally created the Celestial Chest. However, it fails to produce treasures for lack of energy. Only the nourishing jades of the Celestial Mine can promote it. Help me, and the chest will reward you!
Option=Tell me about the Celestial Chest.|dialog:About
Option=Give me a Celestial Chest.|script:getchest
Option=How is my Celestial Chest?|script:status
Option=Take me to the Celestial Mine.|teleport:10005,290,296
Option=I want to combine jades.|dialog:Combine
Option=Just passing by.|close

[Dialog.About]
Text=Mine the Celestial Ores in the Celestial Mine for Earth Jades (sometimes better ones). Use a jade to add Growth Points to your chest: Earth, Sky and Fairy Jades add 1, a Divine Jade adds 3, and every jade brings a prize. With enough Growth Points the chest rises a class, up to Class 9. Open the chest once a day: a Class N chest gives N x 100-min EXP (N x 50 Chi Points at level 140); a Class 9 chest gives a Divine Jade.
Option=How do I combine jades?|dialog:Combine
Option=I see.|close

[Dialog.Combine]
Text=Bring me 9 jades of one kind and I will try to fuse them into a jade of the next kind. Fusion is not always a success, but you will not leave empty-handed.
Option=Combine 9 Earth Jades.|exchange:CombineEarth
Option=Combine 9 Sky Jades.|exchange:CombineSky
Option=Combine 9 Fairy Jades.|exchange:CombineFairy
Option=Maybe later.|close

[Dialog.MineOwner]
Text=Welcome to the Celestial Mine! The glowing Celestial Ores hold nourishing jades. Mine them, but leave some for the others: you can mine 30 times a day.
Option=How do I mine?|dialog:HowToMine
Option=Take me back to Twin City.|teleport:1002,322,252
Option=I will start mining.|close

[Dialog.HowToMine]
Text=Click a Celestial Ore and mine it. Most ores give Earth Jades; with luck you will find a Sky or even a Fairy Jade. Wait a few seconds between two strikes.
Option=I see.|close

[Dialog.Ore]
Text=A Celestial Ore glows with a gentle light. Nourishing jades shine inside it.
Option=Mine the ore.|exchange:Mine
Option=Leave it.|close

; ------------------------------------------------------------------ exchanges
; mining: 30 a day, 5 s apart. GUESS (the client does not say how the jades are mined)
[Exchange.Mine]
Give=pool:Ore
Limit=daily:30
Cooldown=5
Text=You struck the ore.

; "Combining 9 X Jades may bring you a Y Jade" (item texts). Chances and the consolation are a GUESS.
[Exchange.CombineEarth]
Cost=item:3008706x9
Give=item:3008707
Chance=60
FailGive=item:3008706x3
Text=The jades fused into a Sky Jade!
FailText=The fusion failed. The Elder saved 3 Earth Jades for you.
[Exchange.CombineSky]
Cost=item:3008707x9
Give=item:3008708
Chance=50
FailGive=item:3008706x5
Text=The jades fused into a Fairy Jade!
FailText=The fusion failed. The Elder saved 5 Earth Jades for you.
[Exchange.CombineFairy]
Cost=item:3008708x9
Give=item:3008709
Chance=40
FailGive=item:3008707x3
Text=The jades fused into a Divine Jade!
FailText=The fusion failed. The Elder saved 3 Sky Jades for you.

