; Official 6609 Questinfo.ini quests of TaskType 5 (Event), 6 (Nezha`s Feud = story/epic), 8 (Festival),
; 9 (Cross-server), 10 (KingdomWar) and 11 (ScrambleRealm, empty) that have no scripted code on this server and are
; not in another quests*.ini. Agent 4; per-quest status of all 178 in-scope entries: scratchpad quests\story\status.txt.
; Same format as quests.ini (loader Source\Modules\QuestEngine\QuestEngine.cs). Obj kinds: talk|npc|kill|spot|item|level.
; Item objectives whose spot is the begin NPC are handed over at accept (delivery items, taken at completion);
; map 0 = drop only from the named monster (no pick-up at a spot).
; Keys the current loader ignores (proposals, see scratchpad quests\story\NEEDS.md):
;   ActivityBegin/ActivityEnd=yyyy-mm-dd   official Questinfo window (all of them lie in 2010-2017)
;   Season=mm-dd..mm-dd    proposed rule: offer/accept/finish only inside this month-day window, every year
;   Reset=daily            can be taken again after the daily reset (same key as quests_daily.ini)
;   NeedsNpc=... / NeedsMonster=...   NPC / monster type not on this server yet (Npcs.txt is shared - not edited)
;   Note=...               free text for maintainers
; Nezha`s Feud 1577-1589 is one chain (Pre = previous step). Its official map 2092 (a Desert City copy) exists neither
; on the server nor in the client GameMap.dat, so the three NPCs of steps 7-9 are placed in Desert City (1000).
