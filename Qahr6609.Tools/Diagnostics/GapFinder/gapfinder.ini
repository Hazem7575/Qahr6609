; gapfinder settings - change the paths here if the client or server moved.
; Relative paths are relative to this folder. Empty = skip that input.
[paths]
client_exe    = D:\Conquer Online 3.0\Env_DX9\Conquer.exe
client_ini    = D:\Conquer Online 3.0\ini
client_logs   = D:\Conquer Online 3.0\debug\*.log
server_source = ..\..\..\Qahr6609.GameServer
; AccountServer source (it replaced the official login packets with its own 1952)
account_source = ..\..\..\Qahr6609.AccServer
packet_audit  = ..\..\..\Qahr6609.GameServer\bin\Debug\ServerDataBase\Modules\PacketAudit\logs\*.log
compat_report = ..\CompatChecker\report.json

[output]
html = gapfinder_report.html
json = gapfinder_report.json

[options]
; 1 = use capstone (if installed) to confirm the ids by disassembly
use_capstone = 1
; id range accepted as a packet type
min_id = 1000
max_id = 65000
