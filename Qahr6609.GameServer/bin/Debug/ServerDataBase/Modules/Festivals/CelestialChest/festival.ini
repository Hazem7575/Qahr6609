; Celestial Chest (الصندوق السماوي), official 2016-03-17 -> 2016-04-01, level 80+ (client Activity.ini id 103,
; Questinfo 631). Rebuilt from the client's own texts: the item descriptions 3008705-3008719, the quest text ("only the
; nourishing jades in the Celestial Mine can promote the Celestial Chest") and the NPC looks CelestialElder 4020,
; CelestialMineOwner 4021, CelestialOre 4022, map 10005 (CelestialChest.DMap). Values marked GUESS are not in the client.
; Format: Modules\Festivals\code\FestivalData.cs. After a change: @festival reload.

