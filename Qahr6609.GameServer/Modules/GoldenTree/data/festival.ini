; Golden Tree festival, as on the official server (2017 anniversary): the tree blooms every day at a fixed hour, and
; players collect Anniversary Stars (1 star = 1 pick) from the daily quests, the Kingdom Mission, Bliss Boy and
; Dragon Island. Read at start-up and with @goldentree reload; no build needed after a change.

[Festival]
; days of the festival (yyyy-MM-dd, both included). Empty = always on.
; Outside these days: no automatic bloom, no stars, Bliss Boy is not in town (a GM can still @goldentree start).
Start=
End=

[Bloom]
; 1 = the tree blooms by itself every day at Time (server time) for Hours hours
Auto=1
Time=08:00
Hours=3
; most picks of one bloom (0 = the whole prize pool)
MaxPicks=0
; minutes before the bloom: the icon says "Coming Soon" and the window counts down (the client prints
; "Golden Tree is about to bloom!")
Announce=10

[Stars]
; the picking item (must be the CostValue of the conditions in globallotterycondition.ini)
ItemID=3303191
; swap 7 Chi Tokens (daily quests, once a day) -> stars
ChiTokenSwap=3
; open an Outstanding Exploit Pack (Kingdom Mission, 50 Kingdom Deeds) -> stars
ExploitPack=3
; Bliss Boy: Anniversary Blessing, once a day -> stars
Blessing=3
; Dragon Island hunting: every monster killed there gives a star with this chance (percent), at most Max a day
IslandMap=10137
IslandChance=10
IslandMax=20

[BlissBoy]
; the festival NPC (client NpcType 4676 BlissBoy), Twin City
Map=1002
X=308
Y=244
Dir=2
