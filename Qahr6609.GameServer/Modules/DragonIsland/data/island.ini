; Dragon Island (map 10137), as on the official server (2017 update 6532): the beasts come to the island at fixed
; minutes of every hour, players hunt them in the PK zones; Cobb Wind tells where and when; Commander Shan mails the
; rewards (Participation for everyone who fought, Exploit for the best 3 by damage).
; Read at start-up and on every reload of the module (save this file, then save any .cs of the module, or
; "@dragonisland reload"). The module copies this file to ServerDataBase\Modules\DragonIsland\ the first time.

[Island]
Map=10137
; who may enter (Iron Tong, the conductresses, the "beast appeared" message box)
MinLevel=120
MinReborn=1
; arrival point (safe area)
EntryX=95
EntryY=412
; the TwinCity conductress option "Dragon Island" takes the player to Iron Tong
IronTongMap=1002
IronTongX=547
IronTongY=370
; client look of Iron Tong (ini\NpcX.ini [5022] IronTong)
IronTongLook=5022

[Announce]
; the global line and the 60 s "go there?" message box (only to players who may enter)
MessageBox=1
MessageBoxSeconds=60

[Rewards]
; Commander Shan's mails (30-character subject; the boss is written in the mail text)
Sender=Commander Shan
; Participation Reward: everyone whose damage is at least this percent of the beast's HP
ParticipationMinPercent=1
ParticipationItem=3004181
ParticipationCount=1
ParticipationCPs=0
; Exploit Reward: the 3 best by damage (CPs, item)
Exploit1CPs=3000
Exploit2CPs=1500
Exploit3CPs=1000
ExploitItem=723694
; the killer's line to the whole server
KillMessage={0} defeated the {1} and found its grand treasure!

