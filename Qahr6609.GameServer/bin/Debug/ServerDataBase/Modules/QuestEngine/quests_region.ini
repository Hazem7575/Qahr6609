; quests.ini. Of the 336 in-scope MissionIds, 254 are scripted in C# and 77 are in quests.ini; these are the rest.
; Same format as quests.ini (loader: Source\Modules\QuestEngine\QuestEngine.cs). Section names are the MissionId.
; Item objectives use map 0 (drop only from the named monster): with a map the engine also hands the item out
; when standing at the spot, and at accept when the spot is the begin NPC.
; Keys the current loader ignores (proposals, see scratchpad quests\region\NEEDS.md):
;   AutoAccept=1        accept automatically once Pre is finished and the player is eligible (Begin NPC 0)
;   StartItem=<itemId>  accept automatically when the player gets this item (ignores LvMin/LvMax)
;   Daily=1             repeatable once per day (official ActivityType=2)
;   NeedsNpc=...        the begin/finish NPC is not spawned on this server yet
