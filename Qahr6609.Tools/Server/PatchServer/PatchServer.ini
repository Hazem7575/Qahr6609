[Server]
Port=8800
; folder that holds manifest.json, news.json, news\ images and files\ (relative to the exe)
; Launcher feeds served from this Root:
;   GET /news.json   <- edit www\data\news.json   (images: www\news\img\1.jpg ...), newest first
;   GET /status.json <- edit www\data\status.json (maintenance banner) + live game-server status
Root=..\..\www
; client files pushed by the launcher (served as /files/..., manifest.json is built from them), relative to the exe.
; = the repo's ClientPatch\files (only what a stock 6609 client needs for our server, see ClientPatch\README_AR.md).
; empty = Root\files (old behaviour). After changing files there: type "rebuild" in the console or restart.
Files=..\..\..\..\..\ClientPatch\files

[Servers]
; game-server registry for GET /servers (only Published=1 entries are sent; Folder/Exe never).
; empty = HazemConfig.ini (else servers.ini) in the exe folder or the nearest parent folder (the repo root for bin\Release)
File=
; shared login (account) server, used when HazemConfig.ini has no [Auth]/[Login] Host/Port or [Global] AuthHost/AuthPort
; (empty = host of the first published server, port 9961)
LoginHost=
LoginPort=9961
; Online/Offline check = TCP connect to host:GamePort with this timeout, cached CacheSeconds
ProbeTimeoutMs=800
CacheSeconds=5

[Crash]
; 1 = accept launcher crash reports (POST /crash) and store them under www\data\crashes\<date>\
; 0 = reject the upload (the launcher then keeps the report locally on the player's PC only)
Enabled=1
; largest report body accepted, in bytes (reports are small plain text; this is just an abuse cap)
MaxBytes=65536
