; ============================================================
;  Hazem launcher theme  -  عدّل أي حاجة هنا واحفظ الملف
;  اللانشر بيقرا التغييرات وهو شغال (مش محتاج تقفله وتفتحه)
;  الشرح الكامل لكل سطر في: themes\README_THEME.txt
; ============================================================

[Window]
Width=1120
Height=720

[Texts]
; كل نص ليه نسخة إنجليزي بنفس الاسم + _en  (مثال: Subtitle_en)
WindowTitle=Hazem
; يظهر فقط لو مفيش صورة لوجو
LogoText=HAZEM
; السطر الصغير تحت اسم السيرفر في اللوجو
LogoSub=CONQUER ONLINE
Subtitle=اسكربتات حازم
Subtitle_en=HAZEM ONLINE
Play=ابدأ اللعب
Play_en=PLAY NOW!
PlaySub=PLAY NOW
PlaySub_en=START THE GAME
StatusOnline=السيرفر شغال
StatusOnline_en=Online
StatusOffline=السيرفر مقفول
StatusOffline_en=Offline
StatusMaintenance=صيانة
StatusMaintenance_en=Maintenance
; سيبه فاضي عشان يختفي
Footer=
Footer_en=

[Images]
; كل المسارات بالنسبة لفولدر الثيم. سيبها فاضية عشان تخفي الحاجة.
Background=images/bg_main.jpg
; شخصيات جاهزة: images/char_monk.png  أو  images/char_hero.png  أو  images/char_main.png
Character=images/char_flame.png
Logo=
LogoPlate=images/texture_clouds.jpg
FrameTexture=images/texture_clouds.jpg
PanelTexture=
Avatar=images/news_dragon.jpg
Frame=images/frame_smoke.png
Card=images/card_paper.png

[Background]
; 0 = مخفي تماماً ، 1 = ظاهر بالكامل
Opacity=1
TintColor=#FF2A0605
TintOpacity=0.15
LeftShade=0.85
BottomShade=0.9
PatternOpacity=0.05
; ---- سلايدشو الخلفية (صور بتتبدّل ببطء ورا الكارت) ----
; 1 = شغّال ، 0 = اقفله وارجع للخلفية الثابتة (الإطار) زي الأول
Slideshow=0
; فولدر الصور بالنسبة لفولدر الثيم (كل صور jpg/png جواه بتتعرض بالترتيب)
Folder=backgrounds
; أو حدّد صور بعينها (بتتجاهل Folder لو موجودة): Images=backgrounds/bg1_sunset.jpg,backgrounds/bg2_forest.jpg
Images=
; المدة اللي كل صورة تفضل ظاهرة بالثواني
IntervalSeconds=10
; مدة التحول (fade) بالملي ثانية
FadeMs=1500
; sequential = بالترتيب ، random = عشوائي
Order=sequential
; Ken Burns (زووم بطيء) - سيبه 0 عشان ما يستهلكش CPU
KenBurns=0
; فيديو خلفية (اختياري، فاضي = مقفول). ثقيل فوق النافذة الشفافة، بيشتغل بس لو الكارت يدعم (Tier>=2)
Video=

[Character]
Show=1
Height=560
; المسافة من يمين وتحت الشباك (بالبكسل)
Right=0
Bottom=7
Flip=0
Opacity=1
GlowColor=#FFFF7A30
GlowSize=30
GlowOpacity=0.35

[Logo]
; صورة اللوجو فوق الإطار (فاضي = اللوجو المرسوم HAZEM). Width = العرض، OffsetY = تحريك لفوق/لتحت
Image=images/logo_conquer.png
Width=250
OffsetY=0
; الشريط الذهبي تحت اللوجو (فاضي = يختفي)
Ribbon=HAZEM SERVER
Ribbon_en=HAZEM SERVER
Height=52

[Colors]
; الصيغة #AARRGGBB  (AA = الشفافية)
GoldLight=#FFFFE7A8
Gold=#FFE8B64E
GoldDark=#FF8A5512
Accent=#FFF0A040
Author=#FFE0503A
Text=#FFE9DCC8
DimText=#FF9C8A78
Panel=#D0120605
BarTrack=#FF0C0403
FileBar=#FFD02A1E
TotalBar=#FFF0A030
PlayText=#FF3A1504

[Fonts]
; ملف خط من فولدر fonts بالشكل: fonts/اسم_الملف.ttf#اسم الخط  ، أو اسم خط متسطب في الويندوز
Title=fonts/CinzelDecorative-Bold.ttf#Cinzel Decorative
Body=fonts/Cairo-Regular.ttf#Cairo
Logo=fonts/Cinzel-Bold.ttf#Cinzel

[Layout]
NewsWidth=525
ShowGallery=1
ShowStatus=1
PanelTextureOpacity=0.25

[Effects]
Embers=0
EmberCount=12
EmberColor=#FFFFA040

[Gallery]
; الصور اللي بتظهر لو سيرفر الأخبار مقفول (news.json بيغطي عليها لو فيه صور)
Image1=images/news_duel.jpg
Caption1=حرب النقابات
Caption1_en=Guild War
Link1=
Image2=images/news_dragon.jpg
Caption2=تحديثات جديدة
Caption2_en=New Updates
Link2=
Image3=images/news_lanterns.jpg
Caption3=إيفنتات الويك إند
Caption3_en=Weekend Events
Link3=

[OfflineNews]
Tag=INFO
Title=أهلاً بيك في سيرفر حازم
Title_en=Welcome to Hazem
Body=سيرفر الأخبار مش متاح دلوقتي.\nتقدر تدخل اللعبة عادي بالضغط على ابدأ اللعب.
Body_en=The news server is not available right now.\nYou can still enter the game with PLAY NOW.

[Music]
; موسيقى خلفية بتتكرر (loop). المستخدم يقدر يكتمها من زرار السماعة فوق ويفضل محفوظ.
; 1 = شغّال ، 0 = مفيش موسيقى
Enabled=1
; ملف الصوت بالنسبة لفولدر الثيم (wav مضمون، mp3/ogg محتاج كودك على الجهاز)
File=music/theme.mp3
; مستوى الصوت الافتراضي 0..100 (المستخدم يقدر يغيّره من الإعدادات؛ اختياره بيتحفظ في launcher.ini)
Volume=30
; 1 = يبدأ مكتوم
StartMuted=0
; 1 = يوقف الصوت لما اللانشر يتصغّر (افتراضي 0 = يفضل شغال)
PauseWhenMinimized=0

[Card]
; ألوان كارت الأخبار الفاتح (الورقة)
Title=#FF2E2420
Text=#FF4A403A
Dim=#FF8C827A
Tag=#FFE0874A
Link=#FF3A302A
Author=#FFD3352B
; لون يتحط فوق الورقة (0 = من غير)
TintColor=#FFEDE8E0
TintOpacity=0
